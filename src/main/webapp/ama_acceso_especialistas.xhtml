<ui:composition template="/WEB-INF/template/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core">

    <ui:param name="mostrarSidebar" value="false" />
    <ui:param name="vistaActiva" value="acceso" />
    <ui:define name="title-view">AMA - Acceso Seguro</ui:define>

    <ui:define name="head">
        <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&amp;display=swap" rel="stylesheet"/>
        <style>
            body {
                background-color: #FDF3F5 !important;
            }
            .pixel-border-2 {
                border: 2px solid #1b1b1b;
            }
            .pixel-border-4 {
                border: 4px solid #1b1b1b;
            }
            .pixel-shadow {
                box-shadow: 4px 4px 0px 0px #1b1b1b;
            }
            .pixel-shadow-sm {
                box-shadow: 2px 2px 0px 0px #1b1b1b;
            }
            .pixel-input-recessed {
                box-shadow: inset 2px 2px 0px 0px rgba(0,0,0,0.1);
            }
            @keyframes physical-pulse {
                0% { transform: scale(1); box-shadow: 4px 4px 0px 0px #1b1b1b; }
                50% { transform: scale(0.98); box-shadow: 2px 2px 0px 0px #1b1b1b; }
                100% { transform: scale(1); box-shadow: 4px 4px 0px 0px #1b1b1b; }
            }
            .animate-physical-pulse {
                animation: physical-pulse 2s infinite ease-in-out;
            }
            .btn-active-state:active {
                transform: translate(2px, 2px);
                box-shadow: 2px 2px 0px 0px #1b1b1b !important;
            }
        </style>
    </ui:define>

    <ui:define name="content">
        <div class="min-h-screen flex items-center justify-center font-body-md text-on-surface py-12 px-4 relative overflow-x-hidden">

            <main class="relative z-10 w-full max-w-md">

                <!-- Branding Anchor -->
                <div class="flex justify-center mb-8">
                    <h:link outcome="/ama_inicio.xhtml" styleClass="bg-primary-container pixel-border-4 pixel-shadow px-6 py-2 block hover:bg-[#f39fb4] transition-colors">
                        <h1 class="font-headline-lg text-3xl text-on-surface uppercase tracking-tighter font-bold">AMA</h1>
                    </h:link>
                </div>

                <!-- Login Card -->
                <div class="bg-surface-container-lowest pixel-border-4 pixel-shadow p-8 md:p-10 flex flex-col gap-8">

                    <!-- Card Header -->
                    <div class="border-b-2 border-on-surface pb-4">
                        <h2 class="font-headline-md text-2xl text-primary font-bold">Acceso Seguro - Especialistas</h2>
                        <p class="font-label-sm text-sm text-on-surface-variant mt-2 uppercase tracking-widest font-bold">Panel de Diagnóstico Neurocognitivo</p>
                    </div>

                    <!-- Login Form -->
                    <h:form id="loginForm" class="flex flex-col gap-6">

                        <!-- Input Group: Usuario -->
                        <div class="flex flex-col gap-2">
                            <h:outputLabel for="usuario" class="font-label-sm text-sm uppercase flex items-center gap-2 font-bold">
                                <span class="material-symbols-outlined" style="font-size: 18px;">person</span>
                                Usuario o Correo Electrónico
                            </h:outputLabel>
                            <h:inputText id="usuario" value="#{loginBean.usuario}" required="true"
                                         class="w-full bg-surface pixel-border-2 pixel-input-recessed px-4 py-3 font-body-md focus:outline-none focus:ring-2 focus:ring-secondary focus:border-on-surface transition-all"
                                         placeholder="Ingrese su usuario o correo electrónico" />
                        </div>

                        <!-- Input Group: Contraseña -->
                        <div class="flex flex-col gap-2">
                            <h:outputLabel for="password" class="font-label-sm text-sm uppercase flex items-center gap-2 font-bold">
                                <span class="material-symbols-outlined" style="font-size: 18px;">lock</span>
                                Contraseña
                            </h:outputLabel>
                            <div class="ama-password-wrap relative flex items-center">
                                <h:inputSecret id="password" value="#{loginBean.password}" required="true"
                                               class="w-full bg-surface pixel-border-2 pixel-input-recessed px-4 py-3 pr-12 font-body-md focus:outline-none focus:ring-2 focus:ring-secondary focus:border-on-surface transition-all"
                                               placeholder="********" />
                                <button type="button"
                                        class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer select-none text-on-surface-variant hover:text-on-surface bg-transparent border-0 p-0"
                                        style="font-size: 20px;"
                                        onclick="amaTogglePassword(this)"
                                        aria-label="Mostrar contraseña">visibility</button>
                            </div>
                        </div>

                        <!-- Remember Cluster -->
                        <div class="flex items-center mt-2">
                            <label class="flex items-center gap-2 cursor-pointer group">
                                <!-- Cambiamos el <div> por <span> aquí -->
                                <span class="w-5 h-5 pixel-border-2 bg-surface flex items-center justify-center group-hover:bg-primary-container transition-colors relative">
                                    <h:selectBooleanCheckbox value="#{loginBean.recordarme}" class="hidden peer" />
                                    <span class="material-symbols-outlined text-transparent peer-checked:text-on-surface" style="font-size: 16px; font-weight: 900;">check</span>
                                </span> <!-- Y cerramos el <span> aquí -->
                                <span class="font-label-sm text-xs uppercase font-bold">Recordarme</span>
                            </label>
                        </div>

                        <!-- Main Action Button -->
                        <h:commandButton value="INICIAR SESIÓN" action="#{loginBean.login}"
                                         class="w-full mt-4 py-4 bg-[#D87A8E] text-white font-headline-md text-lg uppercase font-bold pixel-border-2 pixel-shadow btn-active-state animate-physical-pulse hover:bg-[#e293a3] transition-colors cursor-pointer">
                            <f:ajax execute="@form" render="@form" />
                        </h:commandButton>

                        <!-- Mensajes de Error Globales -->
                        <h:messages globalOnly="true" showDetail="true" showSummary="false"
                                    class="text-red-600 font-label-sm text-xs text-center border-2 border-red-600 p-2 bg-red-100 uppercase font-bold w-full" />
                    </h:form>

                    <!-- Registro Link -->
                    <div class="text-center pt-1 border-t-2 border-surface-container">
                        <h:link outcome="/ama_registro_especialistas.xhtml" styleClass="font-label-sm text-xs uppercase underline decoration-2 underline-offset-4 hover:text-primary font-bold text-on-surface-variant">
                            ¿No tienes cuenta? Regístrate aquí
                        </h:link>
                    </div>

                    <!-- Botón para Regresar al Inicio -->
                    <div class="pt-2">
                        <h:link outcome="/ama_inicio.xhtml"
                                styleClass="w-full py-3 bg-surface-container-high text-on-surface font-label-sm text-sm uppercase font-bold pixel-border-2 pixel-shadow-sm btn-active-state hover:bg-surface-container-highest transition-colors flex items-center justify-center gap-2 text-center">
                            <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
                            <span>Regresar al Inicio</span>
                        </h:link>
                    </div>

                </div>

                <!-- Footer Help -->
                <div class="mt-8 text-center">
                    <p class="font-label-sm text-sm text-on-surface-variant mb-4 font-bold">¿No tiene acceso? Contacte a administración.</p>
                    <div class="flex justify-center gap-4">
                        <div class="w-8 h-8 pixel-border-2 bg-surface-container-high flex items-center justify-center pixel-shadow-sm hover:translate-y-[-2px] transition-all cursor-pointer">
                            <span class="material-symbols-outlined" style="font-size: 18px;">help_outline</span>
                        </div>
                        <div class="w-8 h-8 pixel-border-2 bg-surface-container-high flex items-center justify-center pixel-shadow-sm hover:translate-y-[-2px] transition-all cursor-pointer">
                            <span class="material-symbols-outlined" style="font-size: 18px;">info</span>
                        </div>
                    </div>
                </div>

            </main>

            <!-- Decorative Pixel Elements -->
            <div class="fixed top-12 left-12 w-16 h-16 pixel-border-2 bg-primary-fixed opacity-40 -rotate-12 hidden lg:block pointer-events-none"></div>
            <div class="fixed bottom-12 right-12 w-24 h-24 pixel-border-2 bg-tertiary-fixed opacity-40 rotate-12 hidden lg:block pointer-events-none"></div>
            <div class="fixed top-1/2 left-24 w-8 h-8 pixel-border-2 bg-secondary-fixed opacity-40 rotate-45 hidden lg:block pointer-events-none"></div>

        </div>

        <!-- SCRIPT PARA EL BOTÓN DE CONTRASEÑA -->
        <script type="text/javascript">
            //<![CDATA[
            function amaTogglePassword(icon) {
                let input = icon.parentElement.querySelector("input");
                let oculto = input.type === 'password';
                input.type = oculto ? 'text' : 'password';
                icon.textContent = oculto ? 'visibility_off' : 'visibility';
                icon.setAttribute('aria-label', oculto ? 'Ocultar contraseña' : 'Mostrar contraseña');
            }
            //]]>
        </script>

    </ui:define>
</ui:composition>
