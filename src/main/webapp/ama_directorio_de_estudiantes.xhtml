<ui:composition template="/WEB-INF/template/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces">

    <!-- Activa el Sidebar lateral y resalta "directorio" en el menú -->
    <ui:param name="mostrarSidebar" value="true" />
    <ui:param name="vistaActiva" value="directorio" />
    <ui:define name="title-view">AMA - Directorio de Estudiantes</ui:define>

    <ui:define name="head">
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <style>
            ::-webkit-scrollbar { width: 12px; }
            ::-webkit-scrollbar-track { background: #eeeeee; border-left: 2px solid #1b1b1b; }
            ::-webkit-scrollbar-thumb { background: #844f5d; border: 2px solid #1b1b1b; }
            .pixel-grid-bg {
                background-image: radial-gradient(#1b1b1b 1px, transparent 1px);
                background-size: 20px 20px;
                opacity: 0.05;
            }
        </style>
        <script id="tailwind-config">
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        "colors": {
                            "on-error-container": "#93000a",
                            "tertiary-fixed": "#b1f2b8",
                            "tertiary": "#2e6a3d",
                            "surface": "#f9f9f9",
                            "on-primary-container": "#764351",
                            "primary": "#844f5d",
                            "on-surface": "#1b1b1b",
                            "on-background": "#1b1b1b",
                            "surface-container-highest": "#e2e2e2",
                            "secondary-fixed": "#ffd9df",
                            "inverse-primary": "#f8b4c4",
                            "tertiary-fixed-dim": "#96d59e",
                            "tertiary-container": "#95d59d",
                            "secondary-container": "#fd99ad",
                            "error-container": "#ffdad6",
                            "background": "#f9f9f9",
                            "on-tertiary-fixed-variant": "#125227",
                            "surface-container-low": "#f3f3f3",
                            "on-secondary-fixed-variant": "#782d40",
                            "secondary": "#954457",
                            "on-primary": "#ffffff",
                            "on-surface-variant": "#514346"
                        },
                        "fontFamily": {
                            "label-sm": ["Courier Prime"],
                            "body-md": ["Courier Prime"],
                            "headline-md": ["Courier Prime"],
                            "headline-lg": ["Courier Prime"],
                            "body-lg": ["Courier Prime"]
                        }
                    }
                }
            }
        </script>
    </ui:define>

    <ui:define name="content">
        <div class="fixed inset-0 pixel-grid-bg pointer-events-none"></div>
        <div class="max-w-container-max mx-auto relative z-10 text-on-background font-body-md">

            <!-- Header Section (Limpio sin lupa ni botón de añadir) -->
            <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                <div>
                    <h1 class="font-headline-lg text-headline-lg text-on-surface uppercase tracking-tight mb-2">Directorio de Estudiantes</h1>
                    <p class="font-body-md text-body-md text-on-surface-variant max-w-2xl">Gestión de expedientes y seguimiento neurocognitivo para la evaluación AMA.</p>
                </div>
            </header>

            <!-- Student Directory Grid -->
            <h:form id="directorioForm">

                <h:messages globalOnly="true" layout="table"
                            styleClass="mb-6 text-xs font-bold uppercase" />

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

                    <!-- Generación Dinámica de Tarjetas usando ui:repeat -->
                    <ui:repeat value="#{directorioBean.listaEstudiantes}" var="estudiante">
                        <article class="bg-surface border-2 border-on-background shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] group">
                            <div class="h-8 #{estudiante.headerCss} border-b-2 border-on-background flex items-center px-4 justify-between">
                                <span class="text-[10px] text-white uppercase font-bold tracking-widest">Expediente: ##{estudiante.expediente}</span>
                                <div class="flex gap-1">
                                    <div class="w-2 h-2 bg-white border border-on-background"></div>
                                    <div class="w-2 h-2 border border-white"></div>
                                </div>
                            </div>
                            <div class="p-6">
                                <div class="flex items-start gap-4 mb-6">

                                    <!-- ── SECCIÓN AVATAR PIXEL ART ÚNICO (DICEBEAR API) ── -->
                                    <div class="w-16 h-16 border-2 border-on-background shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] overflow-hidden bg-secondary-container flex items-center justify-center">
                                        <!-- Genera un personaje pixel art 8-bit único usando el nombre como semilla -->
                                        <img class="w-full h-full object-cover"
                                             src="https://api.dicebear.com/7.x/pixel-art/svg?seed=#{estudiante.nombre}&amp;backgroundColor=transparent"
                                             alt="Avatar de #{estudiante.nombre}"/>
                                    </div>
                                    <!-- ─────────────────────────────────────────────────── -->

                                    <div>
                                        <h3 class="font-headline-md text-headline-md text-on-surface leading-tight mb-1">
                                            <h:outputText value="#{estudiante.nombre}" />
                                        </h3>
                                        <div class="flex gap-2">
                                            <span class="px-2 py-0.5 #{estudiante.estadoCss} border-2 border-on-background font-label-sm text-[10px] uppercase">
                                                <h:outputText value="#{estudiante.estado}" />
                                            </span>
                                        </div>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-4 mb-6">
                                    <div class="border-l-4 border-on-background pl-3">
                                        <p class="text-[10px] text-on-surface-variant uppercase font-bold">Edad</p>
                                        <p class="font-body-lg text-body-lg text-on-surface">
                                            <h:outputText value="#{estudiante.edad} Años" />
                                        </p>
                                    </div>
                                    <div class="border-l-4 border-on-background pl-3">
                                        <p class="text-[10px] text-on-surface-variant uppercase font-bold">Grado</p>
                                        <p class="font-body-lg text-body-lg text-on-surface">
                                            <h:outputText value="#{estudiante.grado}º Primaria" />
                                        </p>
                                    </div>
                                </div>
                                <!-- Enlace hacia el Dashboard del estudiante -->
                                <h:link outcome="/ama_dashboard_interactivo.xhtml" styleClass="w-full bg-secondary-container text-on-secondary-container border-2 border-on-background py-3 font-label-sm text-label-sm shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:bg-inverse-primary active:translate-x-[2px] active:translate-y-[2px] active:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] transition-all flex items-center justify-center gap-2">
                                    <f:param name="usuario" value="#{estudiante.expediente}" />
                                    <span class="material-symbols-outlined text-[20px]">visibility</span>
                                    Ver Reporte
                                </h:link>

                                <!-- Eliminar estudiante (borrado permanente en cascada) -->
                                <h:commandButton value="Eliminar Estudiante"
                                                 action="#{directorioBean.eliminarEstudiante(estudiante.expediente)}"
                                                 onclick="return confirm('¿Seguro que desea eliminar a #{estudiante.nombre}? Esta acción no se puede deshacer.');"
                                                 styleClass="w-full mt-3 bg-error-container text-on-error-container border-2 border-on-background py-3 font-label-sm text-label-sm shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:bg-red-200 active:translate-x-[2px] active:translate-y-[2px] active:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] transition-all flex items-center justify-center gap-2 cursor-pointer">
                                    <f:ajax execute="@this" render="@form" />
                                </h:commandButton>
                            </div>
                        </article>
                    </ui:repeat>

                </div>
            </h:form>

            <!-- Footer con Paginación Simulada -->
            <footer class="mt-16 pt-8 border-t-4 border-on-background flex justify-between items-center mb-10">
                <p class="font-label-sm text-label-sm text-on-surface-variant uppercase">
                    Mostrando <h:outputText value="#{directorioBean.estudiantesMostrados}" /> de <h:outputText value="#{directorioBean.totalEstudiantes}" /> Estudiantes
                </p>
                <div class="flex gap-2 hidden md:flex">
                    <button class="px-4 py-2 bg-surface-container-low border-2 border-on-background shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] font-label-sm text-label-sm active:translate-x-[2px] active:translate-y-[2px] active:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">Anterior</button>
                    <div class="flex items-center gap-1">
                        <div class="w-8 h-8 flex items-center justify-center bg-primary text-on-primary border-2 border-on-background">1</div>
                        <div class="w-8 h-8 flex items-center justify-center bg-surface-container border-2 border-on-background hover:bg-primary-container cursor-pointer">2</div>
                        <div class="w-8 h-8 flex items-center justify-center bg-surface-container border-2 border-on-background hover:bg-primary-container cursor-pointer">3</div>
                    </div>
                    <button class="px-4 py-2 bg-surface-container-low border-2 border-on-background shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] font-label-sm text-label-sm active:translate-x-[2px] active:translate-y-[2px] active:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">Siguiente</button>
                </div>
            </footer>
        </div>
    </ui:define>
</ui:composition>
